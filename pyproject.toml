[project]
name = "catsdogs"
version = "0.1.0"
description = "Lightweight Cats vs Dogs classifier API"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pillow>=10.0",
  "numpy>=1.26",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "torch>=2.2,<2.4",
  "torchvision>=0.17,<0.19",

]
[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
